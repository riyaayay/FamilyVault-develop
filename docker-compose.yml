version: '3.8'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      # The Supabase auth shim MUST run before schema.sql so that auth.uid()
      # and the anon/authenticated/service_role roles exist when the RLS
      # policies are parsed. Files in docker-entrypoint-initdb.d execute in
      # alphabetical name order, so the shim is prefixed "00_".
      - ./contracts/local/00_supabase_shim.sql:/docker-entrypoint-initdb.d/00_supabase_shim.sql:ro
      - ./contracts/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/familyvaultpassword}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "18000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/postgres}
    depends_on:
      db:
        condition: service_healthy
    # Uncomment volumes for hot-reloading code changes
    # volumes:
    #   - ./backend:/app

  graph-service:
    build:
      context: ./graph-service
    restart: unless-stopped
    ports:
      - "18001:8001"
    environment:
      - DEBUG=True
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-familyvaultpassword}
      - NEO4J_DATABASE=neo4j
    depends_on:
      neo4j:
        condition: service_healthy
    # volumes:
    #   - ./graph-service:/app

  biometrics:
    build:
      context: ./biometrics
    restart: unless-stopped
    ports:
      - "18002:8002"
    environment:
      - DEBUG=True
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-familyvault-media}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL:-}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN:-}
      # Fall back to local disk storage when R2 creds are absent so the
      # upload -> recognise -> route loop works in local dev.
      - BIOMETRICS_ALLOW_LOCAL_STORAGE=${BIOMETRICS_ALLOW_LOCAL_STORAGE:-1}
    volumes:
      - insightface_models:/root/.insightface
      - ./biometrics:/app
      - ./contracts:/app/contracts:ro
    working_dir: /app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "1111:1111"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:18000
      - NEXT_PUBLIC_GRAPH_API_URL=http://localhost:18001
      - NEXT_PUBLIC_BIOMETRICS_API_URL=http://localhost:18002
    depends_on:
      - backend
      - graph-service
      - biometrics
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pg_data:
  neo4j_data:
  insightface_models:
