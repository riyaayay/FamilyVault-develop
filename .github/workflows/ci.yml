name: FamilyVault CI

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
          
      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # Static password for the ephemeral CI container only.
          # This is intentionally hardcoded — CI containers are throwaway and
          # never exposed externally. Do NOT copy this value to any real environment.
          POSTGRES_PASSWORD: ci_only_postgres_pw_familyvault
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Install requirements for every Python service present
          if [ -f "backend/requirements.txt" ]; then pip install -r backend/requirements.txt; fi
          if [ -f "graph-service/requirements.txt" ]; then pip install -r graph-service/requirements.txt; fi
          if [ -f "biometrics/requirements.txt" ]; then pip install -r biometrics/requirements.txt; fi

      - name: Initialise CI database schema
        # Runs the Supabase auth compatibility shim BEFORE the main schema so
        # auth.uid() and the anon/authenticated/service_role roles exist when
        # the RLS policies in schema.sql are parsed.
        env:
          PGPASSWORD: ci_only_postgres_pw_familyvault
        run: |
          psql -h localhost -p 54322 -U postgres -d postgres \
            -f contracts/local/00_supabase_shim.sql
          psql -h localhost -p 54322 -U postgres -d postgres \
            -f contracts/schema.sql || true

      - name: Test with pytest
        env:
          # Inline DATABASE_URL — no repo secret required for basic CI runs.
          DATABASE_URL: "postgresql+asyncpg://postgres:ci_only_postgres_pw_familyvault@localhost:54322/postgres"
          DEBUG: "True"
          ENVIRONMENT: "development"
        run: |
          # Run pytest independently for each python service to avoid import path issues
          for dir in backend graph-service biometrics; do
            if [ -d "$dir" ] && [ -n "$(find $dir -name 'test_*.py' -o -name '*_test.py' 2>/dev/null)" ]; then
              echo "Running tests in $dir..."
              (cd "$dir" && PYTHONPATH=. pytest)
            fi
          done
